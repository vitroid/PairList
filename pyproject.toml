[tool.poetry]
name = "pairlist"
version = "1.0.2"
description = "Fast neighbor (pair) lists for particles under periodic boundary conditions."
authors = ["vitroid <vitroid@gmail.com>"]
license = "MIT"
readme = "README.md"
include = [{path = "csource/"}]

[tool.poetry.build]
script = "setup_build.py"
generate-setup-file = true

[tool.poetry.dependencies]
# Pillow 13 (security fixes) requires Python >=3.11; 3.9/3.10 are EOL.
python = "^3.11"
numpy = "^2.0"


[tool.poetry.group.dev.dependencies]
networkx = "^3.2.1"
genice2 = "^2.2"
jinja2 = "^3.1.2"
toml = "^0.10.2"
pdoc = "^14.1.0"
ipykernel = "^6.29.4"
matplotlib = "^3.8.3"
pillow = ">=13.0.0"
tornado = ">=6.5.9"

[build-system]
# Use a NumPy that still ships wheels for each Python.
# numpy==2.0.2 has no 3.13+ wheels and fails to compile from source.
requires = [
    "poetry-core",
    "setuptools",
    "numpy>=2.0.2,<3; python_version < '3.13'",
    "numpy>=2.1.0,<3; python_version >= '3.13' and python_version < '3.14'",
    "numpy>=2.3.0,<3; python_version >= '3.14'",
]
build-backend = "poetry.core.masonry.api"

[tool.cibuildwheel]
# サポートするPythonバージョン
test-command = "python -c \"import pairlist; from cpairlist import pairs, pairs2\""
test-requires = ["numpy"]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *-manylinux_i686 *-musllinux_* pp*"
# Windows、macOS、Linux用のwheelをビルド
build-verbosity = 1
