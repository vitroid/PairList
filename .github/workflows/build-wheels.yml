name: Build wheels

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload built artifacts to PyPI
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install README generator dependencies
        run: python -m pip install jinja2 toml

      - name: Generate README.md from template
        shell: bash
        run: python replacer.py < temp_README.md > README.md

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22,<3"

      - name: Build wheels
        env:
          CIBW_BUILD_VERBOSITY: 3
          # Exact pin without shell-quoting issues; 2.0.2 still has wheels for CPython 3.9-3.12.
          CIBW_BEFORE_BUILD: pip install numpy==2.0.2 poetry-core setuptools wheel build
          CIBW_ENVIRONMENT: "PIP_ONLY_BINARY=:numpy:"
          CIBW_TEST_COMMAND: "python -c \"import pairlist; from cpairlist import pairs, pairs2\""
          CIBW_TEST_REQUIRES: "numpy"
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_* pp* *-cp36 *-cp37 *-cp38"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install README generator dependencies
        run: python -m pip install jinja2 toml

      - name: Generate README.md from template
        shell: bash
        run: python replacer.py < temp_README.md > README.md

      - name: Install build dependencies
        run: python -m pip install build poetry-core

      - name: Build source distribution
        run: python -m build --sdist --outdir dist/

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheelhouse

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Collect wheels into dist
        run: |
          ls -R
          mkdir -p dist
          cp wheelhouse/*.whl dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

